<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Conan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <img src="pic5.jpg" class="login-img-small">
        
        <div class="login-box-large">
            <h2>Sign In</h2>
            <form>
                <input type="email" placeholder="Email Address" class="my-input" required>
                <input type="password" placeholder="Password" class="my-input" required>
                <a href="eps.html" class="login-submit-btn">Login</a>
            </form>
        </div>
    </div>

</body>
</html>
